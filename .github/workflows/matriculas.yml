name: Atualizar matrículas (Censo Escolar)

# A base do Censo muda uma vez por ano, então isto não fica em agenda nenhuma:
# roda quando a base realmente troca. O gatilho de push é o que fecha o ciclo do
# vigia — aceito o Pull Request com a base nova, o painel reprocessa sozinho as
# 178 mil escolas em vez de esperar alguém lembrar de apertar o botão.
on:
  push:
    branches: [main]
    paths:
      - "fonte/matriculas-*.csv.gz"
      - "scripts/build_edu.py"
      - "fonte/legendas.csv"
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo da rotina da planilha: as duas mexem em dados/ e empurram para o
# main, então nunca devem rodar ao mesmo tempo.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  matriculas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir se a fonte está no lugar
        run: |
          if ! ls fonte/matriculas-*.csv.gz >/dev/null 2>&1; then
            echo "::error::Nenhum arquivo em fonte/matriculas-<ano>.csv.gz."
            echo "Gere com: python scripts/preparar_fonte_edu.py \"<csv do INEP>\""
            exit 1
          fi
          ls -lh fonte/

      - name: Gerar os arquivos de matrículas
        run: python scripts/build_edu.py

      - name: Publicar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/edu
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nas matrículas. Nada a publicar."
          else
            git commit -m "Atualiza as matrículas a partir do Censo Escolar"
            git push
            echo "Matrículas atualizadas e publicadas."
          fi
