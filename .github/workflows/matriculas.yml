name: Atualizar matrículas (Censo Escolar)

# A base do Censo muda uma vez por ano, então isto não fica em agenda nenhuma:
# roda quando a base realmente troca. O gatilho de push é o que fecha o ciclo do
# vigia — aceito o Pull Request com a base nova, o painel reprocessa sozinho as
# 178 mil escolas em vez de esperar alguém lembrar de apertar o botão.
on:
  push:
    branches: [main]
    paths:
      - "fonte/matriculas-*.csv.gz"
      - "scripts/build_edu.py"
      - "fonte/legendas.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Os três workflows que geram dados/ e empurram para o main compartilham este
  # grupo — atualizar.yml, matriculas.yml e clp.yml. Antes cada um tinha o seu,
  # então nada impedia que rodassem juntos: foi o que derrubou uma execução
  # quando dois Pull Requests foram aceitos com um minuto de diferença.
  group: grava-em-dados
  cancel-in-progress: false

jobs:
  matriculas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir se a fonte está no lugar
        run: |
          if ! ls fonte/matriculas-*.csv.gz >/dev/null 2>&1; then
            echo "::error::Nenhum arquivo em fonte/matriculas-<ano>.csv.gz."
            echo "Gere com: python scripts/preparar_fonte_edu.py \"<csv do INEP>\""
            exit 1
          fi
          ls -lh fonte/

      - name: Gerar os arquivos de matrículas
        run: python scripts/build_edu.py

      - name: Publicar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/edu
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nas matrículas. Nada a publicar."
          else
            git commit -m "Atualiza as matrículas a partir do Censo Escolar"
            # O main pode ter andado enquanto isto rodava — outro merge, outra
            # rotina. Em vez de deixar o push ser recusado e a execução falhar,
            # a base é atualizada e o commit é refeito por cima. Como tudo em
            # dados/ é gerado, a execução mais recente é a que deve valer; não
            # há conflito possível, é sempre o arquivo inteiro.
            for tentativa in 1 2 3; do
              if git push; then break; fi
              echo "O main avançou. Refazendo o commit sobre a versão nova (tentativa $tentativa)."
              git fetch origin main
              git reset --soft origin/main
              git commit -m "Atualiza as matrículas a partir do Censo Escolar" || true
              sleep 3
            done
            echo "Matrículas atualizadas e publicadas."
          fi
