name: Vigiar o SINISA (saneamento)

# O SINISA publica uma edição por ano, sem data fixa. Uma verificação semanal
# custa duas requisições à página do Ministério das Cidades; os pacotes — cerca
# de 35 MB somando Resíduos, Água e Esgoto — só são baixados quando aparece
# edição que ainda não foi processada.
on:
  schedule:
    - cron: "0 13 * * 4"      # quinta-feira, 10:00 em Brasília
  workflow_dispatch:
    inputs:
      sondar:
        description: "Só investigar a fonte e relatar (não grava nada)"
        type: boolean
        default: false
      forcar:
        description: "Reprocessar mesmo sem edição nova"
        type: boolean
        default: false
      modulo:
        description: "Trabalhar só um módulo (para investigar)"
        type: choice
        default: "todos"
        options: ["todos", "residuos", "agua", "esgoto"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vigiar-sinisa
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet openpyxl

      - name: Sondar a fonte
        if: inputs.sondar
        timeout-minutes: 25
        run: python scripts/monitor_sinisa.py --sondar ${{ (inputs.modulo && inputs.modulo != 'todos') && format('--modulo {0}', inputs.modulo) || '' }}

      - name: Tem edição nova?
        id: checar
        if: ${{ !inputs.sondar }}
        timeout-minutes: 6
        run: python scripts/monitor_sinisa.py --so-checar

      # Três pacotes para baixar e três planilhas grandes para ler: a de Água
      # sozinha tem 5.144 linhas por 67 colunas.
      - name: Baixar e preparar os indicadores
        if: ${{ !inputs.sondar && (steps.checar.outputs.novidade == 'true' || inputs.forcar) }}
        timeout-minutes: 40
        run: |
          python scripts/monitor_sinisa.py \
            ${{ inputs.forcar && '--forcar' || '' }} \
            ${{ (inputs.modulo && inputs.modulo != 'todos') && format('--modulo {0}', inputs.modulo) || '' }}

      # Nada entra no painel sozinho: abre um Pull Request com os indicadores
      # para você conferir antes de aceitar.
      - name: Abrir Pull Request
        if: ${{ !inputs.sondar && (steps.checar.outputs.novidade == 'true' || inputs.forcar) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDICAO: ${{ steps.checar.outputs.edicao }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonte/auto
          if git diff --staged --quiet; then
            echo "Edição nova anunciada, mas os números não mudaram. Nada a fazer."
            exit 0
          fi
          ramo="sinisa/$EDICAO"
          git checkout -b "$ramo"
          git commit -m "SINISA $EDICAO: resíduos sólidos, água e esgotamento sanitário"
          git push --force origin "$ramo"
          python scripts/monitor_sinisa.py --resumo > /tmp/corpo.md
          gh pr create --base main --head "$ramo" \
            --title "SINISA $EDICAO: saneamento (resíduos, água e esgoto)" \
            --body-file /tmp/corpo.md \
            || gh pr edit "$ramo" --body-file /tmp/corpo.md
