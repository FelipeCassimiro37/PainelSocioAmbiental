name: Atualizar dados do painel

on:
  # Quem faz o trabalho de verdade é o gatilho de baixo: assim que um dado novo
  # entra no main (um PR do CAGED aceito, por exemplo), o painel se reconstrói
  # em minutos. O agendamento semanal é só a rede de segurança, para o caso de
  # você editar a planilha e esquecer de avisar.
  #
  # Semanal e não mensal de propósito: o GitHub suspende sozinho o agendamento
  # de repositório parado há 60 dias, e um cron mensal num repositório quieto
  # corre esse risco — pararia de rodar sem avisar ninguém.
  push:
    branches: [main]
    paths:
      - "fonte/**"
      - "scripts/build.py"
  schedule:
    - cron: "0 10 * * 1"      # segunda-feira, 07:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Os três workflows que geram dados/ e empurram para o main compartilham este
  # grupo — atualizar.yml, matriculas.yml e clp.yml. Antes cada um tinha o seu,
  # então nada impedia que rodassem juntos: foi o que derrubou uma execução
  # quando dois Pull Requests foram aceitos com um minuto de diferença.
  group: grava-em-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet openpyxl

      - name: Ler a planilha e gerar os dados
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: python scripts/build.py

      - name: Publicar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos dados."
          else
            git commit -m "Atualiza dados a partir do Google Sheets"
            # O main pode ter andado enquanto isto rodava — outro merge, outra
            # rotina. Em vez de deixar o push ser recusado e a execução falhar,
            # a base é atualizada e o commit é refeito por cima. Como tudo em
            # dados/ é gerado, a execução mais recente é a que deve valer; não
            # há conflito possível, é sempre o arquivo inteiro.
            for tentativa in 1 2 3; do
              if git push; then break; fi
              echo "O main avançou. Refazendo o commit sobre a versão nova (tentativa $tentativa)."
              git fetch origin main
              git reset --soft origin/main
              git commit -m "Atualiza dados a partir do Google Sheets" || true
              sleep 3
            done
          fi
