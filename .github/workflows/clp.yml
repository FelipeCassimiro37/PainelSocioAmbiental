name: Atualizar Ranking de Competitividade (CLP)

# Roda só quando você aperta "Run workflow": o CLP publica uma edição por ano,
# não faz sentido reprocessar de hora em hora como os dados do painel.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Os três workflows que geram dados/ e empurram para o main compartilham este
  # grupo — atualizar.yml, matriculas.yml e clp.yml. Antes cada um tinha o seu,
  # então nada impedia que rodassem juntos: foi o que derrubou uma execução
  # quando dois Pull Requests foram aceitos com um minuto de diferença.
  group: grava-em-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet openpyxl

      - name: Ler a planilha do CLP e gerar os dados
        run: python scripts/build_clp.py

      - name: Publicar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/clp
          if git diff --staged --quiet; then
            echo "Nenhuma mudança no ranking. Nada a publicar."
          else
            git commit -m "Atualiza o Ranking de Competitividade a partir da planilha do CLP"
            # O main pode ter andado enquanto isto rodava — outro merge, outra
            # rotina. Em vez de deixar o push ser recusado e a execução falhar,
            # a base é atualizada e o commit é refeito por cima. Como tudo em
            # dados/ é gerado, a execução mais recente é a que deve valer; não
            # há conflito possível, é sempre o arquivo inteiro.
            for tentativa in 1 2 3; do
              if git push; then break; fi
              echo "O main avançou. Refazendo o commit sobre a versão nova (tentativa $tentativa)."
              git fetch origin main
              git reset --soft origin/main
              git commit -m "Atualiza o Ranking de Competitividade a partir da planilha do CLP" || true
              sleep 3
            done
            echo "Ranking atualizado e publicado."
          fi
